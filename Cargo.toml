[package]
name = "terminal-typer"
version = "0.1.0"
edition = "2024"
authors = ["Terminal Typer Contributors"]
description = "A focused, local-first typing practice instrument for the terminal"
readme = "README.md"
license = "MIT"
keywords = ["typing", "terminal", "tui", "ratatui", "practice"]
categories = ["command-line-utilities"]

[dependencies]
chrono = { version = "0.4.42", features = ["serde"] }
crossterm = "0.29.0"
directories = "6.0.0"
rand = "0.9.2"
ratatui = "0.30.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"

[profile.release]
lto = true
codegen-units = 1
strip = true

